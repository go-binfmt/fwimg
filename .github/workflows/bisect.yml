# Which release made `-O binary` slower than objcopy (go-binfmt/fwimg#17)?
# One job builds every tag and the checked-out commit, then times them against
# objcopy in the SAME interleaved rounds, single core, on the 4 MiB and 32 MiB
# fixtures. Ratio convention as in the README: objcopy time / fwimg time, so
# more than 1x means fwimg is faster. Run it by hand.
name: bisect
on:
  push:
    branches: [perf-regress]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Space-separated tags to build'
        default: 'v0.1.0 v0.2.1 v0.3.0 v0.4.0'
      rounds:
        description: 'Interleaved rounds'
        default: '200'

permissions:
  contents: read

jobs:
  bisect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc binutils
      - env:
          TAGS: ${{ inputs.tags || 'v0.1.0 v0.2.0 v0.2.1 v0.3.0 v0.4.0' }}
          ROUNDS: ${{ inputs.rounds || '200' }}
        run: |
          set -e
          go build -o "$RUNNER_TEMP/bench" ./internal/bench
          go build -o "$RUNNER_TEMP/startup" ./internal/startup
          go build -o "$RUNNER_TEMP/fwimg-head" ./cmd/fwimg
          "$RUNNER_TEMP/bench" -write-small "$RUNNER_TEMP/in4.elf" -fixture 1
          "$RUNNER_TEMP/bench" -write-small "$RUNNER_TEMP/in32.elf" -fixture 2
          cmds_for() { # $1 = fixture name, $2 = path
            args=(-cmd "objcopy=objcopy -O binary $2 $RUNNER_TEMP/o-objcopy")
            for t in $TAGS; do
              args+=(-cmd "$t=$RUNNER_TEMP/fwimg-$t -O binary -o $RUNNER_TEMP/o-$t $2")
            done
            args+=(-cmd "head=$RUNNER_TEMP/fwimg-head -O binary -o $RUNNER_TEMP/o-head $2")
          }
          for t in $TAGS; do
            git worktree add -q "$RUNNER_TEMP/src-$t" "$t"
            (cd "$RUNNER_TEMP/src-$t" && go build -o "$RUNNER_TEMP/fwimg-$t" ./cmd/fwimg)
          done
          for f in in4 in32; do
            echo "## $f.elf, -O binary" | tee -a "$GITHUB_STEP_SUMMARY"
            cmds_for "$f" "$RUNNER_TEMP/$f.elf"
            taskset -c 0 "$RUNNER_TEMP/startup" -rounds "$ROUNDS" "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
