name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      # The differential lane needs the reference tools and a compiler. It is
      # REQUIRED here: FWIMG_REQUIRE_DIFF turns its skip into a failure, so a
      # runner image that loses u-boot-tools cannot turn the lane into a green tick.
      - name: reference tools (objcopy, srec_cat, mkimage, gcc)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc binutils srecord u-boot-tools
          objcopy --version
          srec_cat -version
          mkimage -V
          python3 --version
      # The UF2 oracle: microsoft/uf2 at a pinned commit (uf2conv.py and the
      # family table). The tests find them through these variables and, under
      # FWIMG_REQUIRE_DIFF, fail when they are absent.
      - name: UF2 reference (uf2conv.py, uf2families.json)
        run: |
          d="$RUNNER_TEMP/uf2"
          mkdir -p "$d"
          for f in utils/uf2conv.py utils/uf2families.json; do
            curl -fsSL "https://raw.githubusercontent.com/microsoft/uf2/70fdee51cf15a487526e88ada2d52346596f80af/$f" -o "$d/$(basename "$f")"
          done
          echo "FWIMG_UF2CONV=$d/uf2conv.py" >> "$GITHUB_ENV"
          echo "FWIMG_UF2_FAMILIES=$d/uf2families.json" >> "$GITHUB_ENV"
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # -race and -count=1: a cached PASS must not stand in for this run. The
      # committed fuzz corpus (testdata/fuzz/FuzzFlatten) replays as ordinary tests.
      - name: test, including the differential lane against objcopy and mkimage
        env: { FWIMG_REQUIRE_DIFF: "1" }
        run: go test -race -count=1 -v -run 'Differential' ./...
      - name: test everything else
        run: go test -race -count=1 ./...

  # 32-bit: every size is an int there, and a bound that is only right in 64
  # bits is the kind of bug a 64-bit lane cannot show. Runs natively on the
  # amd64 runner.
  test-386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - name: reference tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc binutils srecord u-boot-tools
      - name: UF2 reference (uf2conv.py, uf2families.json)
        run: |
          d="$RUNNER_TEMP/uf2"
          mkdir -p "$d"
          for f in utils/uf2conv.py utils/uf2families.json; do
            curl -fsSL "https://raw.githubusercontent.com/microsoft/uf2/70fdee51cf15a487526e88ada2d52346596f80af/$f" -o "$d/$(basename "$f")"
          done
          echo "FWIMG_UF2CONV=$d/uf2conv.py" >> "$GITHUB_ENV"
          echo "FWIMG_UF2_FAMILIES=$d/uf2families.json" >> "$GITHUB_ENV"
      - name: go test (GOARCH=386)
        env: { GOARCH: '386', CGO_ENABLED: '0', FWIMG_REQUIRE_DIFF: "1" }
        run: go test -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - name: fuzz FuzzFlatten for 60 seconds
        run: go test -run '^$' -fuzz '^FuzzFlatten$' -fuzztime 60s .
      - name: fuzz FuzzIHEX for 60 seconds
        run: go test -run '^$' -fuzz '^FuzzIHEX$' -fuzztime 60s .
      - name: fuzz FuzzSREC for 60 seconds
        run: go test -run '^$' -fuzz '^FuzzSREC$' -fuzztime 60s .
      - name: fuzz FuzzUImage for 60 seconds
        run: go test -run '^$' -fuzz '^FuzzUImage$' -fuzztime 60s .
      - name: fuzz FuzzVerifyFlat for 60 seconds
        run: go test -run '^$' -fuzz '^FuzzVerifyFlat$' -fuzztime 60s .
      - name: fuzz FuzzParseRegion for 60 seconds
        run: go test -run '^$' -fuzz '^FuzzParseRegion$' -fuzztime 60s .
      - name: fuzz FuzzUF2 for 60 seconds
        run: go test -run '^$' -fuzz '^FuzzUF2$' -fuzztime 60s .
      - name: fuzz FuzzVerilog for 60 seconds
        run: go test -run '^$' -fuzz '^FuzzVerilog$' -fuzztime 60s .
      - name: fuzz FuzzUImageComp for 60 seconds
        run: go test -run '^$' -fuzz '^FuzzUImageComp$' -fuzztime 60s .

  # s390x is BIG-ENDIAN; the ELF parser and the encoders run under that byte
  # order here.
  s390x:
    name: test (s390x, qemu, big-endian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user qemu-user-binfmt
          q=qemu-s390x-static; command -v "$q" >/dev/null 2>&1 || q=qemu-s390x
          echo "QEMU_EXEC=$q" >> "$GITHUB_ENV"
      - name: go test (GOARCH=s390x under qemu)
        env:
          CGO_ENABLED: '0'
          GOARCH: s390x
          GOOS: linux
          # host tools cannot be exec'd from inside the emulator
          FWIMG_SKIP_DIFF: "emulated: host objcopy/mkimage/gcc cannot be exec'd from qemu-user"
        run: |
          echo "running s390x under $QEMU_EXEC"
          go test -count=1 -exec "$QEMU_EXEC" ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: riscv64 }
          - { goos: linux,   goarch: ppc64le }
          - { goos: linux,   goarch: s390x }
          - { goos: linux,   goarch: loong64 }
          - { goos: linux,   goarch: '386' }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: netbsd,  goarch: amd64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: js,      goarch: wasm }
          - { goos: wasip1,  goarch: wasm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }} (CGO=0)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  # wasm (go-binfmt/fwimg, L6): the js/wasm build under node and the wasip1 build
  # under wazero write the same bytes as the native build, over one corpus, and
  # so does the playground engine (the js build on an in-memory file system).
  # FWIMG_REQUIRE_WASM turns a missing node or runtime into a failure.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      # wazero, pinned: the Go distribution's wasip1 wrapper runs it by name.
      - name: wazero
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/tetratelabs/wazero/cmd/wazero@v1.12.0 && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: same bytes as the native build (js under node, wasip1 under wazero, playground engine)
        env: { FWIMG_REQUIRE_WASM: "1", GOWASIRUNTIME: wazero }
        run: go test -count=1 -v -run 'TestWasmSameBytesAsNative' ./cmd/fwimg
      - name: the size of the .wasm
        run: |
          set -eu
          GOOS=js GOARCH=wasm go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/fwimg.wasm" ./cmd/fwimg
          gzip -9 -c "$RUNNER_TEMP/fwimg.wasm" > "$RUNNER_TEMP/fwimg.wasm.gz"
          echo "fwimg.wasm (js, -s -w): $(stat -c %s "$RUNNER_TEMP/fwimg.wasm") bytes, gzip -9: $(stat -c %s "$RUNNER_TEMP/fwimg.wasm.gz") bytes" | tee -a "$GITHUB_STEP_SUMMARY"

  # wasm against native, single core, interleaved rounds (not a gate: the table
  # is printed into the job summary and README quotes it).
  wasm-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: wazero
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/tetratelabs/wazero/cmd/wazero@v1.12.0 && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: |
          set -o pipefail
          go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/fwimg" ./cmd/fwimg
          GOOS=js GOARCH=wasm go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/fwimg-js.wasm" ./cmd/fwimg
          GOOS=wasip1 GOARCH=wasm go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/fwimg-wasip1.wasm" ./cmd/fwimg
          go build -o "$RUNNER_TEMP/wasmbench" ./internal/wasmbench
          uptime
          taskset -c 0 "$RUNNER_TEMP/wasmbench" -native "$RUNNER_TEMP/fwimg" -js "$RUNNER_TEMP/fwimg-js.wasm" -wasi "$RUNNER_TEMP/fwimg-wasip1.wasm" -rounds 15 | tee "$RUNNER_TEMP/wasmbench.md"
          cat "$RUNNER_TEMP/wasmbench.md" >> "$GITHUB_STEP_SUMMARY"

  darwin:
    name: test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: go test -count=1 ./...

  # The system calls behind the start-up gap (go-binfmt/fwimg#2): the same 1 KiB
  # input through objcopy, fwimg, a do-nothing cobra root and the same root with
  # os read and write, each writing to its own fresh file. internal/syscalls
  # runs strace and computes the diff; the raw traces go to the job log.
  strace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc binutils strace
      - run: |
          set -o pipefail
          go build -o "$RUNNER_TEMP/bench" ./internal/bench
          "$RUNNER_TEMP/bench" -write-small "$RUNNER_TEMP/in.elf"
          go build -o "$RUNNER_TEMP/fwimg" ./cmd/fwimg
          go build -o "$RUNNER_TEMP/hello" ./internal/floor/hello
          go build -o "$RUNNER_TEMP/cobraonly" ./internal/floor/cobraonly
          go build -tags floor_osio -o "$RUNNER_TEMP/v-osio" ./internal/floor/cobraonly
          go build -o "$RUNNER_TEMP/syscalls" ./internal/syscalls
          mkdir "$RUNNER_TEMP/tr"
          "$RUNNER_TEMP/fwimg" -O binary -o "$RUNNER_TEMP/expect" "$RUNNER_TEMP/in.elf"
          N=$(stat -c %s "$RUNNER_TEMP/expect")
          "$RUNNER_TEMP/syscalls" -dir "$RUNNER_TEMP/tr" \
            -cmd "objcopy=$(command -v objcopy) -O binary $RUNNER_TEMP/in.elf $RUNNER_TEMP/s1" \
            -cmd "fwimg=$RUNNER_TEMP/fwimg -O binary -o $RUNNER_TEMP/s2 $RUNNER_TEMP/in.elf" \
            -cmd "cobra-only=$RUNNER_TEMP/cobraonly $RUNNER_TEMP/in.elf $RUNNER_TEMP/s3" \
            -cmd "cobra-only+os-io=$RUNNER_TEMP/v-osio $RUNNER_TEMP/in.elf $RUNNER_TEMP/s4 $N" \
            -cmd "hello=$RUNNER_TEMP/hello" | tee "$RUNNER_TEMP/syscalls.md"
          cat "$RUNNER_TEMP/syscalls.md" >> "$GITHUB_STEP_SUMMARY"
          for f in "$RUNNER_TEMP"/tr/*.trace; do echo "=== $f"; cat "$f"; done

  # Single core, interleaved rounds, against the same objcopy and mkimage the
  # differential lane uses. The table is printed into the job summary; README
  # quotes it.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc binutils srecord u-boot-tools
      # uf2conv.py, the UF2 reference (microsoft/uf2 at a pinned commit).
      - run: |
          mkdir -p "$RUNNER_TEMP/uf2"
          for f in uf2conv.py uf2families.json; do
            curl -fsSL "https://raw.githubusercontent.com/microsoft/uf2/70fdee51cf15a487526e88ada2d52346596f80af/utils/$f" -o "$RUNNER_TEMP/uf2/$f"
          done
      - run: |
          set -o pipefail
          go build -o "$RUNNER_TEMP/fwimg" ./cmd/fwimg
          go build -o "$RUNNER_TEMP/hello" ./internal/floor/hello
          go build -o "$RUNNER_TEMP/cobraonly" ./internal/floor/cobraonly
          go build -o "$RUNNER_TEMP/bench" ./internal/bench
          uptime
          taskset -c 0 "$RUNNER_TEMP/bench" -objcopy "$(command -v objcopy)" -mkimage "$(command -v mkimage)" -fwimg "$RUNNER_TEMP/fwimg" -uf2conv "$RUNNER_TEMP/uf2/uf2conv.py" -hello "$RUNNER_TEMP/hello" -cobra "$RUNNER_TEMP/cobraonly" -rounds 60 | tee "$RUNNER_TEMP/bench.md"
          cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"
      # Where the time above a cobra root that does nothing goes
      # (go-binfmt/fwimg#2): the steps of one cold fwimg process, then what
      # each import and each way of doing the I/O adds to cobraonly.
      - run: |
          go build -o "$RUNNER_TEMP/phases" ./internal/phases
          go build -o "$RUNNER_TEMP/startup" ./internal/startup
          go build -tags floor_osio -o "$RUNNER_TEMP/v-osio" ./internal/floor/cobraonly
          go build -tags floor_sysio -o "$RUNNER_TEMP/v-sysio" ./internal/floor/cobraonly
          go build -tags floor_osread -o "$RUNNER_TEMP/v-osread" ./internal/floor/cobraonly
          go build -tags floor_oswrite -o "$RUNNER_TEMP/v-oswrite" ./internal/floor/cobraonly
          go build -tags floor_osio,floor_parse -o "$RUNNER_TEMP/v-osparse" ./internal/floor/cobraonly
          go build -tags floor_osio,floor_flatten -o "$RUNNER_TEMP/v-osflat" ./internal/floor/cobraonly
          go build -tags floor_crc32 -o "$RUNNER_TEMP/v-crc32" ./internal/floor/cobraonly
          go build -tags floor_binary -o "$RUNNER_TEMP/v-binary" ./internal/floor/cobraonly
          go build -tags floor_debug -o "$RUNNER_TEMP/v-debug" ./internal/floor/cobraonly
          go build -tags floor_elfpatch -o "$RUNNER_TEMP/v-elfpatch" ./internal/floor/cobraonly
          go build -tags floor_fwimg -o "$RUNNER_TEMP/v-fwimglib" ./internal/floor/cobraonly
          # The same input fwimg reads, and the size of the output it writes.
          "$RUNNER_TEMP/bench" -write-small "$RUNNER_TEMP/in.elf"
          "$RUNNER_TEMP/fwimg" -O binary -o "$RUNNER_TEMP/expect" "$RUNNER_TEMP/in.elf"
          N=$(stat -c %s "$RUNNER_TEMP/expect")
          taskset -c 0 "$RUNNER_TEMP/phases" -rounds 100 | tee "$RUNNER_TEMP/phases.md"
          taskset -c 0 "$RUNNER_TEMP/startup" -rounds 400 \
            -cmd "fwimg=$RUNNER_TEMP/fwimg -O binary -o $RUNNER_TEMP/o0 $RUNNER_TEMP/in.elf" \
            -cmd "cobra-only=$RUNNER_TEMP/cobraonly $RUNNER_TEMP/in.elf $RUNNER_TEMP/o1 $N" \
            -cmd "+ os read only=$RUNNER_TEMP/v-osread $RUNNER_TEMP/in.elf $RUNNER_TEMP/o2 $N" \
            -cmd "+ os write only=$RUNNER_TEMP/v-oswrite $RUNNER_TEMP/in.elf $RUNNER_TEMP/o3 $N" \
            -cmd "+ os read and write=$RUNNER_TEMP/v-osio $RUNNER_TEMP/in.elf $RUNNER_TEMP/o4 $N" \
            -cmd "+ syscall read and write=$RUNNER_TEMP/v-sysio $RUNNER_TEMP/in.elf $RUNNER_TEMP/o5 $N" \
            -cmd "+ os read and write, one elfpatch Parse=$RUNNER_TEMP/v-osparse $RUNNER_TEMP/in.elf $RUNNER_TEMP/o6 $N" \
            -cmd "+ os read and write, one Flatten=$RUNNER_TEMP/v-osflat $RUNNER_TEMP/in.elf $RUNNER_TEMP/o7" \
            -cmd "+ import hash/crc32=$RUNNER_TEMP/v-crc32 $RUNNER_TEMP/in.elf $RUNNER_TEMP/o8 $N" \
            -cmd "+ import encoding/binary=$RUNNER_TEMP/v-binary $RUNNER_TEMP/in.elf $RUNNER_TEMP/o9 $N" \
            -cmd "+ import runtime/debug=$RUNNER_TEMP/v-debug $RUNNER_TEMP/in.elf $RUNNER_TEMP/o10 $N" \
            -cmd "+ import elfpatch=$RUNNER_TEMP/v-elfpatch $RUNNER_TEMP/in.elf $RUNNER_TEMP/o11 $N" \
            -cmd "+ import fwimg library=$RUNNER_TEMP/v-fwimglib $RUNNER_TEMP/in.elf $RUNNER_TEMP/o12 $N" \
            -cmd "hello=$RUNNER_TEMP/hello" | tee "$RUNNER_TEMP/ablation.md"
          { echo; cat "$RUNNER_TEMP/phases.md"; echo; cat "$RUNNER_TEMP/ablation.md"; } >> "$GITHUB_STEP_SUMMARY"
